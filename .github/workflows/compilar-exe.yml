name: Fabricar .exe de Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # para publicar la descarga en "Releases"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ARGOS_PACKAGES_DIR: ${{ github.workspace }}\modelos\argos
      EASYOCR_MODULE_PATH: ${{ github.workspace }}\modelos\easyocr
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c versiones_exe.txt
          pip install pyinstaller

      - name: Descargar modelos (OCR + idiomas) dentro de la carpeta "modelos"
        run: python descargar_idiomas.py

      - name: Crear icono
        run: python crear_icono.py

      - name: Compilar con PyInstaller
        shell: pwsh
        run: |
          # Algunas librerías (p. ej. sentencepiece) guardan DLLs en carpetas "*.libs"
          # que PyInstaller no copia solo: se agregan a mano.
          $sp = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $extra = @()
          foreach ($lib in Get-ChildItem $sp -Directory -Filter "*.libs") {
            Write-Host "Incluyendo $($lib.Name)"
            $extra += "--add-binary"; $extra += "$($lib.FullName)\*;$($lib.Name)"
          }
          pyinstaller --noconfirm --windowed `
            --name "Traductor de Pantalla" --icon icono.ico `
            --collect-all easyocr --collect-all argostranslate --collect-all ctranslate2 `
            --collect-all sentencepiece --collect-all stanza --collect-all minisbd `
            --collect-all torchvision --collect-data skimage `
            --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 `
            @extra traductor_pantalla.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Copiar modelos, glosario e instrucciones
        shell: pwsh
        run: |
          $d = "dist\Traductor de Pantalla"
          Copy-Item -Recurse modelos "$d\modelos"
          Copy-Item glosario.json "$d\glosario.json"
          Copy-Item LEEME_EXE.txt "$d\LEEME.txt"

      - name: Autoprueba (leer y traducir una imagen con el .exe)
        shell: pwsh
        env:
          ARGOS_PACKAGES_DIR: ""
          EASYOCR_MODULE_PATH: ""
        run: |
          $d = "dist\Traductor de Pantalla"
          $p = Start-Process -FilePath "$d\Traductor de Pantalla.exe" -ArgumentList "--autoprueba" -Wait -PassThru
          Get-Content "$d\autoprueba.txt" -Encoding UTF8
          if (Test-Path "$d\registro.txt") { Get-Content "$d\registro.txt" -Tail 40 -Encoding UTF8 }
          if ($p.ExitCode -ne 0) { Write-Error "La autoprueba falló"; exit 1 }
          Remove-Item "$d\autoprueba.txt", "$d\registro.txt" -ErrorAction SilentlyContinue

      - name: Prueba de arranque (abrir la ventana 90 s)
        shell: pwsh
        env:
          ARGOS_PACKAGES_DIR: ""
          EASYOCR_MODULE_PATH: ""
        run: |
          $d = "dist\Traductor de Pantalla"
          $p = Start-Process -FilePath "$d\Traductor de Pantalla.exe" -PassThru
          Start-Sleep -Seconds 90
          $vivo = -not $p.HasExited
          if ($vivo) { Stop-Process -Id $p.Id -Force }
          if (Test-Path "$d\registro.txt") { Get-Content "$d\registro.txt" -Tail 40 -Encoding UTF8 }
          Remove-Item "$d\registro.txt", "$d\config.json" -ErrorAction SilentlyContinue
          if (-not $vivo) { Write-Error "El programa se cerró solo al arrancar"; exit 1 }

      - name: Grabar video de demostración
        continue-on-error: true
        shell: pwsh
        env:
          ARGOS_PACKAGES_DIR: ""
          EASYOCR_MODULE_PATH: ""
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          $d = "dist\Traductor de Pantalla"
          Remove-Item "$d\demo_*" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$d\Traductor de Pantalla.exe" -ArgumentList "--demo" -PassThru
          $t = 0; while (-not (Test-Path "$d\demo_listo") -and $t -lt 120) { Start-Sleep 1; $t++ }
          $ff = Start-Process ffmpeg -ArgumentList "-y -f gdigrab -framerate 20 -draw_mouse 1 -i desktop -t 120 -c:v libx264 -preset ultrafast -pix_fmt yuv420p demo_crudo.mkv" -PassThru -NoNewWindow
          Start-Sleep 2
          New-Item "$d\demo_grabando" -ItemType File | Out-Null
          $t = 0; while (-not (Test-Path "$d\demo_fin") -and $t -lt 110) { Start-Sleep 1; $t++ }
          Start-Sleep 1
          Stop-Process -Id $ff.Id -ErrorAction SilentlyContinue
          Start-Sleep 2
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          ffmpeg -y -i demo_crudo.mkv -c:v libx264 -preset slow -crf 24 -pix_fmt yuv420p -movflags +faststart demo.mp4
          Remove-Item "$d\demo_*", "$d\registro.txt", "$d\config.json", "$d\historial.json" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory demo_rama | Out-Null
          Copy-Item demo.mp4 demo_rama\demo.mp4
          Set-Location demo_rama
          git init -q
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo.mp4
          git commit -q -m "Video de demostración"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:demo

      - name: Comprimir
        shell: pwsh
        run: 7z a -tzip -mx=5 TraductorPantalla-Windows.zip "dist\Traductor de Pantalla"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TraductorPantalla-Windows
          path: TraductorPantalla-Windows.zip
          compression-level: 0

      - name: Publicar en Releases (descarga directa)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v3-build${{ github.run_number }}"
          gh release create $tag TraductorPantalla-Windows.zip --title "Traductor de Pantalla (Windows) - compilación ${{ github.run_number }}" --notes "Descarga TraductorPantalla-Windows.zip, descomprímelo y abre 'Traductor de Pantalla.exe'. No necesita Python ni internet."
