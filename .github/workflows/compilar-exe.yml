name: Fabricar .exe de Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # para publicar la descarga en "Releases"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ARGOS_PACKAGES_DIR: ${{ github.workspace }}\modelos\argos
      EASYOCR_MODULE_PATH: ${{ github.workspace }}\modelos\easyocr
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c versiones_exe.txt
          pip install pyinstaller

      - name: Descargar diccionarios sin internet dentro de la carpeta "modelos"
        run: python descargar_idiomas.py

      - name: Instalar lector japonés de Windows y fuentes japonesas (para las pruebas)
        continue-on-error: true
        timeout-minutes: 14
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~ja-JP~0.0.1.0" | Out-Null
          Add-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0" | Out-Null
          Add-WindowsCapability -Online -Name "Language.Fonts.Jpan~~~und-JPAN~0.0.1.0" | Out-Null
          Get-WindowsCapability -Online | Where-Object Name -like "Language.OCR*" | Format-Table Name, State

      - name: Crear icono
        run: python crear_icono.py

      - name: Compilar con PyInstaller
        shell: pwsh
        run: |
          # Algunas librerías (p. ej. sentencepiece) guardan DLLs en carpetas "*.libs"
          # que PyInstaller no copia solo: se agregan a mano.
          $sp = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $extra = @()
          foreach ($lib in Get-ChildItem $sp -Directory -Filter "*.libs") {
            Write-Host "Incluyendo $($lib.Name)"
            $extra += "--add-binary"; $extra += "$($lib.FullName)\*;$($lib.Name)"
          }
          pyinstaller --noconfirm --windowed `
            --name "Traductor de Pantalla" --icon icono.ico `
            --collect-all ctranslate2 --collect-all sentencepiece --collect-all faster_whisper `
            --collect-all winrt --collect-data soundcard --collect-submodules fontTools `
            --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 `
            --hidden-import pystray._win32 --hidden-import brotli `
            --hidden-import actualizar --hidden-import subtitulos_voz --hidden-import lector `
            --hidden-import traduccion --hidden-import version --hidden-import estilo `
            --hidden-import capa_natural --hidden-import tema --hidden-import bandeja `
            --hidden-import marca --hidden-import marca_datos --hidden-import atajos `
            @extra lanzador.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Copiar modelos, glosario e instrucciones
        shell: pwsh
        run: |
          $d = "dist\Traductor de Pantalla"
          Copy-Item -Recurse modelos "$d\modelos"
          Copy-Item glosario.json "$d\glosario.json"
          # fuentes libres para el estilo natural (las japonesas grandes no: Windows ya trae)
          New-Item -ItemType Directory "$d\fuentes" -Force | Out-Null
          Get-ChildItem fuentes | Where-Object { $_.Name -notin @("NotoSansJP.ttf", "NotoSerifJP.ttf") } | Copy-Item -Destination "$d\fuentes"
          New-Item -ItemType Directory "$d\app" -Force | Out-Null
          Get-ChildItem *.py | Where-Object { $_.Name -notin @("lanzador.py", "crear_icono.py") } | Copy-Item -Destination "$d\app"
          Copy-Item LEEME_EXE.txt "$d\LEEME.txt"

      - name: Crear audio de prueba (voz sintética de Windows)
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.Rate = 0
          $s.SetOutputToWaveFile("$PWD\dist\Traductor de Pantalla\voz_prueba.wav")
          $s.Speak("Welcome to the village, traveler.")
          $s.Speak("  ")
          $s.Speak("The forest to the north is dangerous at night.")
          $s.Dispose()

      - name: Autoprueba (leer y traducir una imagen con el .exe)
        shell: pwsh
        env:
          ARGOS_PACKAGES_DIR: ""
          EASYOCR_MODULE_PATH: ""
        run: |
          $d = "dist\Traductor de Pantalla"
          $p = Start-Process -FilePath "$d\Traductor de Pantalla.exe" -ArgumentList "--autoprueba" -Wait -PassThru
          Get-Content "$d\autoprueba.txt" -Encoding UTF8
          if (Test-Path "$d\registro.txt") { Get-Content "$d\registro.txt" -Tail 40 -Encoding UTF8 }
          if ($p.ExitCode -ne 0) { Write-Error "La autoprueba falló"; exit 1 }
          Remove-Item "$d\autoprueba.txt", "$d\registro.txt", "$d\voz_prueba.wav", "$d\historial.json" -ErrorAction SilentlyContinue

      - name: Capturas de la prueba en el registro (para revisarlas)
        if: always()
        shell: pwsh
        run: |
          $d = "dist\Traductor de Pantalla\capturas_prueba"
          if (Test-Path $d) {
            Get-ChildItem "$d\*.png" | ForEach-Object {
              Write-Host "===IMG $($_.Name)==="
              $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
              for ($i = 0; $i -lt $b.Length; $i += 3000) { Write-Host ("B64 " + $b.Substring($i, [Math]::Min(3000, $b.Length - $i))) }
              Write-Host "===FIN==="
            }
          }

      - name: Guardar las capturas de la prueba (para revisarlas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-prueba
          path: |
            dist/Traductor de Pantalla/capturas_prueba/*.png
            dist/Traductor de Pantalla/autoprueba.txt
            dist/Traductor de Pantalla/registro.txt
          if-no-files-found: ignore

      - name: Prueba de arranque (abrir la ventana 90 s)
        shell: pwsh
        env:
          ARGOS_PACKAGES_DIR: ""
          EASYOCR_MODULE_PATH: ""
        run: |
          $d = "dist\Traductor de Pantalla"
          $p = Start-Process -FilePath "$d\Traductor de Pantalla.exe" -PassThru
          Start-Sleep -Seconds 90
          $vivo = -not $p.HasExited
          if ($vivo) { Stop-Process -Id $p.Id -Force }
          if (Test-Path "$d\registro.txt") { Get-Content "$d\registro.txt" -Tail 40 -Encoding UTF8 }
          Remove-Item "$d\registro.txt", "$d\config.json" -ErrorAction SilentlyContinue
          if (-not $vivo) { Write-Error "El programa se cerró solo al arrancar"; exit 1 }

      - name: Tamaño del paquete (qué ocupa más)
        if: always()
        shell: pwsh
        run: |
          $d = "dist\Traductor de Pantalla"
          if (Test-Path $d) {
            $total = (Get-ChildItem $d -Recurse -File | Measure-Object Length -Sum).Sum
            Write-Host ("TOTAL: {0:N0} MB" -f ($total / 1MB))
            Get-ChildItem $d -Directory -Recurse -Depth 1 | ForEach-Object {
              [pscustomobject]@{ MB = [math]::Round(((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1); Carpeta = $_.FullName.Substring((Resolve-Path $d).Path.Length) }
            } | Sort-Object MB -Descending | Select-Object -First 25 | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            Get-ChildItem $d -Recurse -File | Sort-Object Length -Descending | Select-Object -First 15 |
              ForEach-Object { Write-Host ("{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path $d).Path.Length)) }
          }

      - name: Comprimir
        shell: pwsh
        run: |
          $d = "dist\Traductor de Pantalla"
          # nada de las pruebas dentro del paquete
          Remove-Item -Recurse -Force "$d\capturas_prueba", "$d\fuentes_usuario" -ErrorAction SilentlyContinue
          Remove-Item "$d\memoria.sqlite*", "$d\perfiles.json", "$d\config.json", "$d\historial.json", "$d\registro.txt" -ErrorAction SilentlyContinue
          # los modelos (diccionarios sin internet y voz) no van en el paquete: el programa los
          # descarga solo la primera vez y las versiones completas los conservan
          Remove-Item -Recurse -Force "$d\modelos" -ErrorAction SilentlyContinue
          7z a -tzip -mx=5 TraductorPantalla-Windows.zip "dist\Traductor de Pantalla"
          Write-Host ("Paquete: {0:N0} MB" -f ((Get-Item TraductorPantalla-Windows.zip).Length / 1MB))

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TraductorPantalla-Windows
          path: TraductorPantalla-Windows.zip
          compression-level: 0

      - name: Preparar actualización ligera
        shell: pwsh
        run: |
          $v = python -c "import version; print(version.VERSION)"
          $b = python -c "import version; print(version.BASE_MINIMA)"
          Compress-Archive -Path "dist\Traductor de Pantalla\app\*.py" -DestinationPath actualizacion.zip -Force
          # huellas SHA-256: el programa comprueba lo que descarga antes de instalarlo
          $h1 = (Get-FileHash actualizacion.zip -Algorithm SHA256).Hash.ToLower()
          $h2 = (Get-FileHash TraductorPantalla-Windows.zip -Algorithm SHA256).Hash.ToLower()
          '{"version": "' + $v + '", "base_minima": ' + $b + ', "sha256_app": "' + $h1 + '", "sha256_paquete": "' + $h2 + '"}' | Out-File -Encoding ascii version.json
          Get-Content version.json
          "VERSION=$v" >> $env:GITHUB_ENV
          "SHA_PAQUETE=$h2" >> $env:GITHUB_ENV

      - name: Publicar en Releases (descarga directa)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION-build${{ github.run_number }}"
          gh release create $tag TraductorPantalla-Windows.zip actualizacion.zip version.json --title "Traductor de Pantalla $env:VERSION (compilación ${{ github.run_number }})" --notes "Primera vez: descarga TraductorPantalla-Windows.zip, descomprímelo y abre 'Traductor de Pantalla.exe'. Si ya lo tienes, el programa se actualiza solo con el botón Actualizar (también las versiones grandes) y comprueba cada descarga. Huella SHA-256 del paquete: $env:SHA_PAQUETE"
